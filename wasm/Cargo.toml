[package]
name = "crucible-wasm"
version = "0.1.0"
edition = "2021"
description = "Small pure-Rust ONNX interpreter (Add, MatMul, Relu, Sigmoid, Softmax) compiled to WASM; separate from the native C++ engine"
rust-version = "1.88"
publish = false

[lib]
# cdylib for wasm-pack; rlib so tests/parity.rs can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"

[dev-dependencies]
serde_json = "1.0"

# Size-oriented release build for the browser bundle.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
