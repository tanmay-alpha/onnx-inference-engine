# Engine CI: builds the C++17 engine from source, runs the GoogleTest suite,
# runs the Python-binding parity tests against onnxruntime, and (Linux only)
# runs the FastAPI server tests against the real native extension and smokes
# the Rust CLI over the shared library. Nothing here is skipped when the
# native build is missing: a missing artifact is a failure.

name: Engine (native C++ + Python bindings)

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'server/**'
      - 'models/**'
      - 'cli/**'
      - '.gitmodules'
      - '.github/workflows/ci-engine.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'server/**'
      - 'models/**'
      - 'cli/**'
      - '.gitmodules'
      - '.github/workflows/ci-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC, Ninja)
            os: ubuntu-latest
            # Single-config generator; -Werror; shared lib for the CLI.
            cmake_args: >-
              -G Ninja
              -DCRUCIBLE_WARNINGS_AS_ERRORS=ON
              -DCRUCIBLE_BUILD_SHARED=ON
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          - name: Windows (MSVC)
            os: windows-latest
            # Default Visual Studio generator (multi-config): artifacts land
            # in per-config subdirectories, e.g. <build>/python/Release.
            cmake_args: ''
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the submodules the build needs. google-benchmark is only used by
      # CRUCIBLE_ENABLE_BENCHMARKS (off here).
      - name: Init submodules (eigen, googletest, pybind11)
        run: |
          git submodule update --init --depth 1 \
            engine/third_party/eigen \
            engine/third_party/googletest \
            engine/third_party/pybind11

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build ccache

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('engine/**/*.cpp', 'engine/**/*.h', 'engine/**/*.hpp', 'engine/**/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S engine -B "$BUILD_DIR" ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRUCIBLE_ENABLE_TESTS=ON \
            -DCRUCIBLE_ENABLE_PYTHON_BINDINGS=ON \
            -DCRUCIBLE_ENABLE_BENCHMARKS=OFF \
            -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"

      - name: Build
        run: cmake --build "$BUILD_DIR" --config Release --parallel 4

      - name: CTest
        run: ctest --test-dir "$BUILD_DIR" -C Release --output-on-failure --parallel 4

      # Single-config generators put the module in <build>/python, multi-config
      # (MSVC) in <build>/python/<Config>. Locate it rather than guessing.
      - name: Locate crucible_py
        run: |
          mod=$(find "$BUILD_DIR/python" -maxdepth 2 \( -name 'crucible_py*.so' -o -name 'crucible_py*.pyd' \) | head -n 1)
          if [ -z "$mod" ]; then
            echo "::error::crucible_py extension not found under $BUILD_DIR/python"
            exit 1
          fi
          pydir=$(cd "$(dirname "$mod")" && pwd)
          echo "Found $mod"
          echo "CRUCIBLE_PY_DIR=$pydir" >> "$GITHUB_ENV"

      - name: Install Python test dependencies
        run: python -m pip install numpy onnx onnxruntime pytest

      - name: Parity tests vs onnxruntime
        run: python -m pytest engine/tests/python/test_parity.py -q

      - name: Install server dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Server tests against the native engine (Linux)
        if: runner.os == 'Linux'
        env:
          CRUCIBLE_REQUIRE_NATIVE: '1'
        run: PYTHONPATH="$CRUCIBLE_PY_DIR:." python -m pytest server -q

      - name: Set up Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('cli/Cargo.toml', 'cli/Cargo.lock', 'cli/build.rs') }}
          restore-keys: cargo-cli-${{ runner.os }}-

      - name: Build CLI against libcrucible (Linux)
        if: runner.os == 'Linux'
        run: CRUCIBLE_LIB_DIR="$PWD/$BUILD_DIR" cargo build --release --manifest-path cli/Cargo.toml

      - name: CLI smoke test (Linux)
        if: runner.os == 'Linux'
        run: LD_LIBRARY_PATH="$PWD/$BUILD_DIR" ./cli/target/release/crucible info --model models/resnet18.onnx

      - name: CLI tests (Linux)
        if: runner.os == 'Linux'
        run: |
          CRUCIBLE_LIB_DIR="$PWD/$BUILD_DIR" LD_LIBRARY_PATH="$PWD/$BUILD_DIR" \
            cargo test --release --manifest-path cli/Cargo.toml
