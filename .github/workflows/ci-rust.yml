# Rust CI for the browser runtime in wasm/ (pure Rust, no C++ dependency).
# The CLI in cli/ links the C++ shared library, so it is built and smoke-tested
# in ci-engine.yml where that library is produced.

name: Rust (WASM runtime)

on:
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    paths:
      - 'wasm/**'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: cargo test + clippy (native, wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('wasm/Cargo.toml', 'wasm/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Test (native)
        run: cargo test --release

      - name: Clippy (native)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
