# Render blueprint for the Crucible API. The web frontend is deployed on
# Vercel (https://crucible-ivory-three.vercel.app), not here.
#
# Notes:
# - Free instances have an ephemeral disk: uploaded model files under
#   CRUCIBLE_MODEL_DIR vanish on restart/redeploy (DB rows remain; /infer then
#   answers 410 and the model must be uploaded again).
# - DATABASE_URL is required in production (e.g. a Supabase/Neon Postgres URL;
#   postgresql:// URLs are accepted and mapped to asyncpg/psycopg2).
services:
  - type: web
    name: crucible-onnx-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: CRUCIBLE_SECRET_KEY
        generateValue: true
      # Optional operator key (sees all users' data). Leave unset to disable.
      - key: CRUCIBLE_API_KEY
        sync: false
      - key: CRUCIBLE_CORS_ORIGINS
        value: https://crucible-ivory-three.vercel.app
      - key: CRUCIBLE_MODEL_DIR
        value: /tmp/models
      # Memory budget for a 512 MB free instance: one model analysis at a time
      # peaks at ~2x the file (protobuf bytes + parsed graph), so 50 MB uploads
      # cost ~100 MB; one native run is capped at 32M live intermediate
      # elements (128 MB float32). Together with the interpreter (~150 MB)
      # both fit at once with headroom.
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
      - key: MAX_GRAPH_NODES
        value: "2000"
      - key: MAX_MODELS_PER_USER
        value: "20"
      - key: MAX_STORAGE_BYTES_PER_USER
        value: "209715200"
      - key: MAX_REQUEST_BODY_BYTES
        value: "16777216"
      - key: MAX_INPUT_ELEMENTS
        value: "4000000"
      - key: MAX_OUTPUT_ELEMENTS
        value: "1000000"
      - key: MAX_TENSOR_ELEMENTS
        value: "16000000"
      - key: MAX_TOTAL_ELEMENTS
        value: "32000000"
      # Run deadline: the engine stops the run and /infer answers 504.
      - key: INFERENCE_TIMEOUT_SEC
        value: "60"
      - key: MAX_CONCURRENT_INFERENCES
        value: "1"
      # Render's proxy sets the first X-Forwarded-For entry to the real client
      # IP, so the per-IP auth rate limits may use it. Limits are per process.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: CRUCIBLE_LOG_LEVEL
        value: INFO
      - key: CRUCIBLE_LOG_FORMAT
        value: json
      - key: TZ
        value: UTC
