# Local full stack: Postgres + API (native engine) + web + Prometheus/Grafana.
#   CRUCIBLE_SECRET_KEY=$(openssl rand -hex 32) docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: crucible-postgres
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crucible}
      POSTGRES_DB: crucible
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible -d crucible"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: crucible-server
    environment:
      DATABASE_URL: postgresql://crucible:${POSTGRES_PASSWORD:-crucible}@postgres:5432/crucible
      CRUCIBLE_SECRET_KEY: ${CRUCIBLE_SECRET_KEY:?set CRUCIBLE_SECRET_KEY}
      # Optional operator key; empty disables operator access.
      CRUCIBLE_API_KEY: ${CRUCIBLE_API_KEY:-}
      CRUCIBLE_CORS_ORIGINS: ${CRUCIBLE_CORS_ORIGINS:-http://localhost:3000}
      CRUCIBLE_MODEL_DIR: /crucible/models
      CRUCIBLE_LOG_FORMAT: console
    ports:
      - "8000:8000"
    volumes:
      - model_files:/crucible/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    command: >
      sh -c "cd /crucible/server && alembic upgrade head &&
             cd /crucible && uvicorn server.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: crucible-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - server
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: crucible-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.0
    container_name: crucible-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  model_files:
  grafana_data:
  prometheus_data:
