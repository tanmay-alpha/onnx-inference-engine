[package]
name        = "crucible-cli"
version     = "0.1.0"
edition     = "2021"
description = "Command-line front-end for the Crucible ONNX inference engine (links the C ABI shared library)."
license     = "MIT"
publish     = false
build       = "build.rs"

# Four commands: run, benchmark, validate, info.
#
#   main.rs      — clap parsing, dispatch
#   runner.rs    — FFI bindings to the crucible C ABI (engine/include/crucible/c_api.h)
#   formatter.rs — output rendering (text + JSON)
#
# Linking: build.rs links `crucible` (shared library) from $CRUCIBLE_LIB_DIR,
# which is required at build time. At run time the dynamic loader must find
# the library too (LD_LIBRARY_PATH / DYLD_LIBRARY_PATH / PATH).
[dependencies]
clap       = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"

# Optimise release builds so `benchmark` measures an optimised client.
[profile.release]
lto        = "thin"
opt-level  = 3
strip      = true

[[bin]]
name = "crucible"
path = "src/main.rs"
